    NEW PROJECT PAGE: copy this file, rename it (e.g. my-project.html), then
    link a tile to it from index.html. Delete any blocks you don't need, and
    copy any block to use it again. All styling lives in style.css.

  <header class="site-header">

      <a href="assets/Camilo_Artigas_Resume.pdf" target="_blank">Resume</a>

  <article class="project">

    <img class="hero" src="assets/your-image.png" alt="Describe the image" />

    <p>A second paragraph also wraps around the hero image.</p>

    <h3>Features</h3>
    <ul>
      <li>First feature</li>
      <li>Second feature</li>
    </ul>

    <h3>Design</h3>
    <p>Explain a part of the project. Links work too: <a href="index.html">like this</a>.</p>

    <!-- Gallery: a centered row of images; add as many as you like -->
    <div class="gallery">
      <img src="assets/your-image-2.png" alt="Describe the image" />
      <img src="assets/your-image-3.png" alt="Describe the image" />
    </div>
